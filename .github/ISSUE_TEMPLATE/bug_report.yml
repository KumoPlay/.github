name: "🐞 Bug report"
description: Something isn't working the way it should? Tell us!
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make our games better! 💜
        Fill in what you can. It's okay if you don't know every answer.

        **Found a security or privacy problem?** Please don't post it here. Follow our [security policy](https://github.com/KumoPlay/.github/blob/main/SECURITY.md) instead.

  - type: input
    id: game
    attributes:
      label: Which game?
      description: If you're already in the game's own repository, you can leave this empty.
      placeholder: "e.g. Kumo Farm, or \"the website\""

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you saw. Screenshots or a short video help a lot. You can drag them right in here.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?

  - type: textarea
    id: steps
    attributes:
      label: How can we see it too?
      description: The steps that lead to the problem, if you remember them.
      placeholder: |
        1. Open the game
        2. Tap on ...
        3. Then ...

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - Every time
        - Sometimes
        - It happened once

  - type: dropdown
    id: device
    attributes:
      label: What were you playing on?
      multiple: true
      options:
        - iPhone
        - Android phone
        - iPad or tablet
        - Computer
        - Something else

  - type: input
    id: browser
    attributes:
      label: Which browser? (if you know)
      placeholder: "e.g. Safari, Chrome, Firefox"
